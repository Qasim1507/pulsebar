name: Build

# Every push to main builds both installers as workflow artifacts.
# Pushing a tag like v0.1.0 also publishes them on a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            targets: ""
            args: --bundles nsis
            artifact: PulseBar-windows
            path: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            # One DMG that runs on both Apple Silicon and Intel Macs.
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
            artifact: PulseBar-macos
            path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --lib
        working-directory: src-tauri
      - run: npm run tauri build -- ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.path }}
          fail_on_unmatched_files: true
          body: |
            **Download**
            - macOS (Apple Silicon and Intel): the `.dmg` file
            - Windows: the `-setup.exe` file

            The app is not code-signed yet, so the first launch needs one extra step — see "Install" in the README.
